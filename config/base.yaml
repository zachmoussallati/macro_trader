# Base configuration — defaults shared by all environments.
# Environment overrides live in dev.yaml / test.yaml / prod.yaml.
# Secrets always come from .env (never YAML).

env: dev

database:
  host: localhost
  port: 5432
  name: macro_trader
  user: macro
  password: ""
  test_name: macro_trader_test
  pool_size: 5
  max_overflow: 10
  echo_sql: false

api:
  host: 0.0.0.0
  port: 8000
  reload: true
  cors_origins:
    - http://localhost:5173

auth:
  jwt_algorithm: HS256
  access_token_expire_minutes: 60
  refresh_token_expire_days: 30
  admin_email: admin@example.com

dagster:
  home: ./dagster_home
  port: 3000

frontend:
  dev_server_url: http://localhost:5173

claude_api:
  model: claude-opus-4-7

logging:
  level: INFO
  format: console

data_sources: {}

methods:
  default_promotion:
    min_shadow_period_days: 180
    min_comparison_runs: 12
    improvement_threshold: 0.05
  comparison_schedule:
    default_cron: "0 6 * * *"
