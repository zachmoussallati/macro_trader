# Base configuration — defaults shared by all environments.
# Environment overrides live in dev.yaml / test.yaml / prod.yaml.
# Secrets always come from .env (never YAML).

env: dev

database:
  host: localhost
  port: 5432
  name: macro_trader
  user: macro
  password: ""
  test_name: macro_trader_test
  pool_size: 5
  max_overflow: 10
  echo_sql: false

api:
  host: 0.0.0.0
  port: 8000
  reload: true
  cors_origins:
    - http://localhost:5173

auth:
  jwt_algorithm: HS256
  access_token_expire_minutes: 60
  refresh_token_expire_days: 30
  admin_email: admin@example.com

dagster:
  home: ./dagster_home
  port: 3000

frontend:
  dev_server_url: http://localhost:5173

claude_api:
  model: claude-opus-4-7

logging:
  level: INFO
  format: console

data_sources: {}

methods:
  default_promotion:
    min_shadow_period_days: 180
    min_comparison_runs: 12
    improvement_threshold: 0.05
  comparison_schedule:
    default_cron: "0 6 * * *"

signals:
  # Operator override for the dashboard's "designated production-facing
  # method" per component. Resolution order in
  # macro_trader.signals.designated.resolve:
  #   config override (this map) -> PRODUCTION -> BASELINE -> first-registered.
  designated_per_component:
    trend_signal: trend.ensemble.v1
    carry_signal: carry.spot_proxy.v1
    value_signal: value.zscore.v1
    positioning_signal: positioning.cot_zscore.v1
    dislocation_signal: dislocation.pca.v1
    factor_exposure_signal: factor_exposure.ols.v1
    catalyst_signal: catalyst.event_study.v1
  trend:
    sma_short:
      fast: 10
      slow: 30
    sma_medium:
      fast: 20
      slow: 60
    sma_long:
      fast: 50
      slow: 200
    hp_filter:
      lambda: 1600
    ensemble_weights:
      sma_short: 0.333
      sma_medium: 0.333
      sma_long: 0.334
    regime_conditional_weights:
      enabled: false
      weights_by_regime: {}
  carry:
    spot_proxy:
      enabled_for: [CL, BZ, GC, NG]
      confidence_when_proxy_available: 0.3
      confidence_when_proxy_unavailable: 0.0
  positioning:
    cot_zscore:
      lookback_weeks: 156
      min_history_weeks: 52
      extreme_threshold: 2.0
      report_type: disaggregated
    cot_commercial:
      lookback_weeks: 156
      min_history_weeks: 52
      extreme_threshold: 2.0
      report_type: legacy
  factor_exposure:
    factors:
      growth: { fred_series: "FRED:INDPRO", transform: yoy_change, zscore_window: 252 }
      inflation: { fred_series: "FRED:CPIAUCSL", transform: yoy_change, zscore_window: 252 }
      liquidity: { fred_series: "FRED:DFII2", transform: level_inverted, zscore_window: 252 }
      usd: { fred_series: "FRED:DTWEXBGS", transform: 60d_return, zscore_window: 252 }
      oil: { fred_series: "FRED:DCOILWTICO", transform: 60d_return, zscore_window: 252 }
      risk_on: { fred_series: "FRED:VIXCLS", transform: 60d_change_inverted, zscore_window: 252 }
    ols:
      lookback_days: 252
      min_history_days: 252
    rf:
      n_estimators: 200
      max_depth: 5
      min_samples_leaf: 20
      lookback_days: 504
      random_state: 42
    causal_forest:
      n_estimators: 200
      min_samples_leaf: 20
      lookback_days: 504
      random_state: 42
    refit:
      cadence: weekly
      day_of_week: 0
      hour_utc: 1
  catalyst:
    event_kinds: [data_release, central_bank, supply_event]
    importance: [medium, high]
    event_window: [-1, 1]
    extended_window: [-1, 5]
    lookback_years: 5
    forward_window_days: 10
    time_decay: linear
    min_events_for_estimate: 5
    causal:
      n_estimators: 200
      min_samples_leaf: 20
    refit:
      cadence: weekly
      day_of_week: 0
      hour_utc: 2
  dislocation:
    pca:
      lookback_days: 252
      n_components: 3
      min_history_days: 252
    dfm:
      lookback_days: 504
      n_factors: 3
      k_ar: 1
      maxiter: 200
      min_history_days: 504
    refit:
      # Stage 4A re-fits on each daily run for both methods. A weekly
      # refit asset that persists fitted state to
      # system.methods_registry.serialized_blob is the next step; see
      # notes/stage_4a/tradeoffs.md.
      cadence: daily
  value:
    zscore:
      lookback_window: 252
    cross_sectional:
      # Groupings come from market_data.instruments at compute time.
      # Stage 4B reseeded sub_class to coarse-but-rankable values
      # (crude_oil / refined_products / base_metals / precious_metals
      # / grains) so sub_class is now the default. asset_class is
      # available as a fallback if you want even coarser groupings.
      class_column: sub_class
  output:
    zscore_lookback: 252
    rank_universe: all
    rolling_sharpe_window: 252
    rolling_sharpe_vol_target: 0.10
  schedule:
    daily_run_time_utc: "23:30"
